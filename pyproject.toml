[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-ai-anime-pipeline"
version = "0.1.0"
description = "Local-first pipeline for narrated AI-anime short videos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
bili-anime = "bili_anime_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

